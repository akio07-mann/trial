<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Removed</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            font-family: "Trebuchet MS", Arial, sans-serif;

            background:
                radial-gradient(circle at 20% 20%, #ffd6e7, transparent 30%),
                radial-gradient(circle at 80% 80%, #d9d4ff, transparent 30%),
                linear-gradient(135deg, #fff1f7, #eeeaff);

            color: #493646;
        }

        .card {
            width: min(90%, 600px);
            padding: 55px 35px;
            text-align: center;

            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(15px);

            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 30px;

            box-shadow:
                0 25px 70px rgba(100, 70, 110, 0.2);

            animation: appear 0.8s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .icon {
            font-size: 65px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(30px, 7vw, 48px);
            color: #d24d82;
            margin-bottom: 18px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            color: #6d5868;
        }

        .highlight {
            margin-top: 20px;
            padding: 18px;

            border-radius: 18px;

            background: rgba(255, 220, 235, 0.55);

            color: #75465d;
            font-weight: bold;
        }

        .thankyou {
            margin-top: 25px;
            font-size: 16px;
            color: #967c8e;
        }

        .heart {
            margin-top: 20px;
            font-size: 28px;

            animation: heartbeat 1.3s infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #aa96a5;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icon">🫥</div>

        <h1>This Page Is No Longer Here</h1>

        <p>
            The owner has removed this page.
        </p>

        <div class="highlight">
            Apparently, the friends didn't share it  😭
        </div>

        <p class="thankyou">
            So... the page has officially retired. 🫡
            <br><br>
            Thank you for visiting anyway. 💖
        </p>

        <div class="heart">
            ❤️
        </div>

        <div class="footer">
            Page removed by the owner • Nothing to see here 👀
        </div>

    </div>

</body>
</html>
