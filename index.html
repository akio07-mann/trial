<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prom? 💃</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #2b0a3d, #6a1b9a, #d81b60, #6a1b9a, #2b0a3d);
    background-size: 400% 400%;
    animation: bgShift 12s ease infinite;
    overflow: hidden;
    position: relative;
  }

  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .sparkle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.7;
    animation: twinkle 2.5s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.6); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  /* soft spotlight glow under each doll */
  .doll-wrap {
    position: absolute;
    bottom: 40px;
    width: 160px;
    z-index: 1;
    filter: drop-shadow(0 10px 12px rgba(0,0,0,0.35));
  }
  .doll-wrap.left { left: 4%; }
  .doll-wrap.right { right: 4%; }

  .spotlight {
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 130px;
    height: 26px;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.35), transparent 70%);
    border-radius: 50%;
    animation: glowPulse 1.1s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 0.9; }
  }

  /* SVG doll bounce + sway */
  .doll-svg { display: block; width: 100%; height: auto; transform-origin: bottom center; animation: bodyBounce 1.1s ease-in-out infinite; }
  .doll-wrap.left .doll-svg { animation-delay: 0s; }
  .doll-wrap.right .doll-svg { animation-delay: 0.55s; }

  @keyframes bodyBounce {
    0%   { transform: rotate(-6deg) translateY(0); }
    25%  { transform: rotate(4deg) translateY(-8px); }
    50%  { transform: rotate(-3deg) translateY(0); }
    75%  { transform: rotate(6deg) translateY(-10px); }
    100% { transform: rotate(-6deg) translateY(0); }
  }

  /* limb transform-origins need fill-box for SVG elements */
  .arm-l, .arm-r, .leg-l, .leg-r, .head-grp {
    transform-box: fill-box;
    transform-origin: top center;
  }
  .arm-l { animation: armSwingL 1.1s ease-in-out infinite; }
  .arm-r { animation: armSwingR 1.1s ease-in-out infinite; }
  .leg-l { animation: legSwingL 1.1s ease-in-out infinite; transform-origin: top center; }
  .leg-r { animation: legSwingR 1.1s ease-in-out infinite; transform-origin: top center; }
  .head-grp { animation: headBob 1.1s ease-in-out infinite; transform-origin: bottom center; }

  @keyframes armSwingL { 0%,100% { transform: rotate(-30deg); } 50% { transform: rotate(20deg); } }
  @keyframes armSwingR { 0%,100% { transform: rotate(30deg); } 50% { transform: rotate(-20deg); } }
  @keyframes legSwingL { 0%,100% { transform: rotate(10deg); } 50% { transform: rotate(-12deg); } }
  @keyframes legSwingR { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(12deg); } }
  @keyframes headBob   { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }

  /* --- MAIN CARD --- */
  .card {
    position: relative;
    z-index: 5;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(8px);
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 24px;
    padding: 40px 32px;
    text-align: center;
    max-width: 440px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    animation: floatCard 4s ease-in-out infinite;
  }
  @keyframes floatCard {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .card h1 {
    color: #fff;
    font-size: 1.8rem;
    margin-bottom: 10px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
  }
  .card p#subtext {
    color: #ffe6f2;
    margin-bottom: 26px;
    font-size: 1rem;
  }

  .buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    position: relative;
    height: 60px;
  }

  button {
    padding: 14px 30px;
    font-size: 1.05rem;
    font-weight: bold;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  #yesBtn {
    background: linear-gradient(135deg, #ffd54f, #ffb300);
    color: #4a2c00;
    box-shadow: 0 0 20px rgba(255,213,79,0.6);
    animation: pulseYes 1.5s ease-in-out infinite;
  }
  @keyframes pulseYes {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.07); }
  }
  #yesBtn:hover { transform: scale(1.1); }

  #noBtn {
    background: #ececec;
    color: #333;
    position: relative;
  }
  #noBtn:hover { transform: scale(1.05); }

  /* --- POPUP OVERLAY --- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.78);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 20;
    text-align: center;
    padding: 20px;
  }
  .overlay.show { display: flex; }

  .overlay h2 {
    color: #fff;
    font-size: 2.1rem;
    margin-bottom: 25px;
    text-shadow: 0 0 20px #ff5da2;
    animation: celebrateText 1s ease infinite;
  }
  @keyframes celebrateText {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .party-dolls {
    display: flex;
    gap: 24px;
    align-items: flex-end;
    flex-wrap: wrap;
    justify-content: center;
  }

  .party-dolls .doll-wrap {
    position: relative;
    bottom: 0;
    left: auto;
    right: auto;
    width: 110px;
  }
  .party-dolls .doll-svg { animation-name: partyDance; animation-duration: 0.6s; }
  .party-dolls .doll-wrap:nth-child(2) .doll-svg,
  .party-dolls .doll-wrap:nth-child(4) .doll-svg { animation-delay: 0.15s; }
  .party-dolls .doll-wrap:nth-child(3) .doll-svg { animation-delay: 0.3s; }

  @keyframes partyDance {
    0%, 100% { transform: rotate(-12deg) translateY(0); }
    50% { transform: rotate(12deg) translateY(-18px); }
  }

  /* confetti */
  .confetti {
    position: absolute;
    top: -20px;
    width: 10px;
    height: 16px;
    opacity: 0.9;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0% { transform: translateY(-20px) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(360deg); }
  }
</style>
</head>
<body>

  <!-- GIRL DOLL (left) -->
  <div class="doll-wrap left">
    <div class="spotlight"></div>
    <svg class="doll-svg" viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="skinL" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffe0c2"/>
          <stop offset="100%" stop-color="#f4b98a"/>
        </linearGradient>
        <linearGradient id="dressL" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff8fc7"/>
          <stop offset="55%" stop-color="#ff4fa3"/>
          <stop offset="100%" stop-color="#d81b7a"/>
        </linearGradient>
        <linearGradient id="hairL" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5a3722"/>
          <stop offset="100%" stop-color="#2e1c10"/>
        </linearGradient>
      </defs>

      <!-- back leg -->
      <g class="leg-r">
        <rect x="86" y="150" width="14" height="55" rx="7" fill="url(#skinL)"/>
        <ellipse cx="93" cy="210" rx="11" ry="7" fill="#7a1f4b"/>
      </g>
      <!-- front leg -->
      <g class="leg-l">
        <rect x="60" y="150" width="14" height="55" rx="7" fill="url(#skinL)"/>
        <ellipse cx="67" cy="210" rx="11" ry="7" fill="#7a1f4b"/>
      </g>

      <!-- dress / torso -->
      <path d="M50 100 Q80 85 110 100 L122 165 Q80 185 38 165 Z" fill="url(#dressL)"/>
      <path d="M50 100 Q80 90 110 100 L108 118 Q80 108 52 118 Z" fill="#ffffff" opacity="0.25"/>
      <ellipse cx="80" cy="100" rx="30" ry="12" fill="#ff9fd0"/>

      <!-- back arm -->
      <g class="arm-r">
        <rect x="103" y="95" width="12" height="46" rx="6" fill="url(#skinL)"/>
        <circle cx="109" cy="141" r="7" fill="#f4b98a"/>
      </g>
      <!-- front arm -->
      <g class="arm-l">
        <rect x="45" y="95" width="12" height="46" rx="6" fill="url(#skinL)"/>
        <circle cx="51" cy="141" r="7" fill="#f4b98a"/>
      </g>

      <!-- neck -->
      <rect x="72" y="78" width="16" height="18" fill="#f4b98a"/>

      <!-- head group -->
      <g class="head-grp">
        <!-- hair back volume -->
        <path d="M40 60 Q40 20 80 20 Q120 20 120 60 Q120 95 100 95 Q108 55 80 50 Q52 55 60 95 Q40 95 40 60Z" fill="url(#hairL)"/>
        <!-- face -->
        <circle cx="80" cy="60" r="27" fill="url(#skinL)"/>
        <!-- hair front bangs -->
        <path d="M53 52 Q80 30 107 52 Q100 38 80 36 Q60 38 53 52Z" fill="url(#hairL)"/>
        <!-- ear -->
        <circle cx="106" cy="63" r="4" fill="#f4b98a"/>
        <!-- blush -->
        <ellipse cx="67" cy="66" rx="5" ry="3" fill="#ff9aa8" opacity="0.7"/>
        <ellipse cx="93" cy="66" rx="5" ry="3" fill="#ff9aa8" opacity="0.7"/>
        <!-- eyes -->
        <path d="M64 58 Q69 54 74 58" stroke="#3a2416" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M86 58 Q91 54 96 58" stroke="#3a2416" stroke-width="2" fill="none" stroke-linecap="round"/>
        <circle cx="69" cy="61" r="2.2" fill="#2e1c10"/>
        <circle cx="91" cy="61" r="2.2" fill="#2e1c10"/>
        <!-- brows -->
        <path d="M62 52 Q69 49 76 52" stroke="#3a2416" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <path d="M84 52 Q91 49 98 52" stroke="#3a2416" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <!-- nose -->
        <path d="M80 63 Q78 68 80 70" stroke="#e0a173" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <!-- lips -->
        <path d="M71 76 Q80 82 89 76 Q80 80 71 76Z" fill="#c8536f"/>
        <!-- hair side strand -->
        <path d="M52 58 Q46 75 54 92" stroke="url(#hairL)" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M108 58 Q114 75 106 92" stroke="url(#hairL)" stroke-width="8" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <!-- BOY DOLL (right) -->
  <div class="doll-wrap right">
    <div class="spotlight"></div>
    <svg class="doll-svg" viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="skinR" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e8b48a"/>
          <stop offset="100%" stop-color="#c98a58"/>
        </linearGradient>
        <linearGradient id="suitR" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3a3f5a"/>
          <stop offset="100%" stop-color="#1c1f30"/>
        </linearGradient>
        <linearGradient id="hairR" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2b1a10"/>
          <stop offset="100%" stop-color="#150c07"/>
        </linearGradient>
      </defs>

      <!-- back leg -->
      <g class="leg-r">
        <rect x="86" y="150" width="15" height="58" rx="6" fill="url(#suitR)"/>
        <rect x="83" y="204" width="21" height="9" rx="4" fill="#0e0e12"/>
      </g>
      <!-- front leg -->
      <g class="leg-l">
        <rect x="59" y="150" width="15" height="58" rx="6" fill="url(#suitR)"/>
        <rect x="56" y="204" width="21" height="9" rx="4" fill="#0e0e12"/>
      </g>

      <!-- torso / jacket -->
      <path d="M50 98 Q80 84 110 98 L114 160 Q80 172 46 160 Z" fill="url(#suitR)"/>
      <path d="M70 100 L80 118 L90 100 L86 160 L74 160 Z" fill="#f4f4f4"/>
      <rect x="77" y="104" width="6" height="10" fill="#c81f4a"/>
      <ellipse cx="80" cy="99" rx="30" ry="10" fill="#2a2d42"/>

      <!-- back arm -->
      <g class="arm-r">
        <rect x="104" y="94" width="13" height="48" rx="6" fill="url(#suitR)"/>
        <circle cx="110" cy="142" r="7" fill="url(#skinR)"/>
      </g>
      <!-- front arm -->
      <g class="arm-l">
        <rect x="43" y="94" width="13" height="48" rx="6" fill="url(#suitR)"/>
        <circle cx="49" cy="142" r="7" fill="url(#skinR)"/>
      </g>

      <!-- neck -->
      <rect x="72" y="78" width="16" height="18" fill="#c98a58"/>

      <!-- head group -->
      <g class="head-grp">
        <circle cx="80" cy="60" r="27" fill="url(#skinR)"/>
        <!-- hair -->
        <path d="M52 55 Q52 28 80 28 Q108 28 108 55 Q108 40 80 38 Q52 40 52 55Z" fill="url(#hairR)"/>
        <path d="M52 50 Q56 44 62 46 Q58 50 58 56Z" fill="url(#hairR)"/>
        <!-- ear -->
        <circle cx="106" cy="63" r="4" fill="#c98a58"/>
        <!-- eyes -->
        <path d="M64 58 Q69 55 74 58" stroke="#2a1a10" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M86 58 Q91 55 96 58" stroke="#2a1a10" stroke-width="2" fill="none" stroke-linecap="round"/>
        <circle cx="69" cy="60" r="2" fill="#1a0f08"/>
        <circle cx="91" cy="60" r="2" fill="#1a0f08"/>
        <!-- brows -->
        <path d="M62 51 Q69 47 77 50" stroke="#2a1a10" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M83 50 Q91 47 98 51" stroke="#2a1a10" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <!-- nose -->
        <path d="M80 62 Q78 68 80 70" stroke="#a86b3f" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <!-- mouth -->
        <path d="M72 76 Q80 80 88 76" stroke="#8a4a3a" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <div class="card">
    <h1 id="question">Will you go to prom with me? 💌</h1>
    <p id="subtext">I've been dancing around this question long enough...</p>
    <div class="buttons">
      <button id="yesBtn" onclick="sayYes()">Yes 💖</button>
      <button id="noBtn" onclick="sayNo()">No</button>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <h2>SHE SAID YES! 🎉💃🕺</h2>
    <div class="party-dolls" id="partyDolls"></div>
  </div>

<script>
  const body = document.body;
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    s.style.animationDelay = Math.random() * 2 + 's';
    body.appendChild(s);
  }

  const noResponses = [
    { q: "Are you sure? 🥺", sub: "Take a second look, this button is shrinking already..." },
    { q: "Really really sure?? 😳", sub: "It's getting harder to say no, isn't it..." },
    { q: "Last chance to say yes... 👀", sub: "The 'No' button is about to give up." }
  ];

  let noCount = 0;
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const question = document.getElementById('question');
  const subtext = document.getElementById('subtext');

  function sayNo() {
    noCount++;

    if (noCount < 3) {
      const r = noResponses[noCount - 1];
      question.textContent = r.q;
      subtext.textContent = r.sub;

      const scale = Math.max(0.4, 1 - noCount * 0.2);
      noBtn.style.transform = `scale(${scale})`;
      yesBtn.style.transform = `scale(${1 + noCount * 0.08})`;

      const x = (Math.random() - 0.5) * 120;
      const y = (Math.random() - 0.5) * 40;
      noBtn.style.position = 'relative';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    } else {
      question.textContent = "No more! You are going with me! 😤💘";
      subtext.textContent = "There is only one option now...";
      noBtn.style.display = 'none';
      yesBtn.style.transform = 'scale(1.3)';
    }
  }

  function sayYes() {
    document.getElementById('overlay').classList.add('show');
    spawnPartyDolls();
    spawnConfetti();
  }

  function spawnPartyDolls() {
    const container = document.getElementById('partyDolls');
    const girl = document.querySelector('.doll-wrap.left').outerHTML;
    const boy = document.querySelector('.doll-wrap.right').outerHTML;
    container.innerHTML = girl + boy + girl + boy;
  }

  function spawnConfetti() {
    const overlay = document.getElementById('overlay');
    const colors = ['#ff5da2', '#ffd54f', '#4fc3f7', '#a3ff7a', '#fff'];
    for (let i = 0; i < 60; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDuration = (2 + Math.random() * 2) + 's';
      c.style.animationDelay = Math.random() * 2 + 's';
      overlay.appendChild(c);
    }
  }
</script>

</body>
</html>
